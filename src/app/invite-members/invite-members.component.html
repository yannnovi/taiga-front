<fieldset class="create-project-invite">
    <div class="create-project-invite-avatars">
        <tg-single-member
            *ngFor="let member of members"
            [disabled]="isDisabled(member.get('id'))"
            [avatar]="member"
            (click)="toggleInvitedMember.emit({member: member.get('id')})"
        ></tg-single-member>
    </div>
</fieldset>
